name: Bug
description: Un build faux, un crash, une arme manquante, un affichage cassé.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui cloche
      description: Ce que tu attendais, ce qui s’est passé.
    validations:
      required: true
  - type: input
    id: weapon
    attributes:
      label: Arme
      placeholder: M4A1, Model 1…
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Traders, flea, objectif, lien de partage si tu en as un.
  - type: textarea
    id: extra
    attributes:
      label: Captures / précisions
